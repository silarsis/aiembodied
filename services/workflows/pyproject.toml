[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiembodied-workflows"
version = "0.1.0"
description = "Temporal workflows for aiembodied: the avatars' sense of time (life loop, reminders, watches, agent-built flows)"
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.37",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.0",
  "websockets>=12",
  # Windows has no IANA zone database; without it every named zone falls back to a fixed UTC offset.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
aiembodied-workflows = "aiembodied_workflows.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
