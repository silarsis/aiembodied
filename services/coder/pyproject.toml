[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-runner"
version = "0.1.0"
description = "Runs the pi coding agent on tasks from the aiembodied app, each in its own git worktree and branch"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
coding-runner = "coder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coder = ["assets/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
