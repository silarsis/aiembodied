[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiembodied-voice-service"
version = "0.1.0"
description = "Local speech-to-text (faster-whisper) and text-to-speech (Kokoro) HTTP service for the aiembodied app"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.0",
  "numpy>=1.23",
]

[project.optional-dependencies]
# Both run on the CPU, so no ROCm torch is needed and the GPU stays free for Qwen and ARDY.
local = ["faster-whisper>=1.1", "kokoro-onnx>=0.4"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
voice-service = "voice_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
