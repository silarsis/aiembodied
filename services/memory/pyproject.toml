[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-engine"
version = "0.1.0"
description = "Long-term conversational memory for chat agents: every message kept in PostgreSQL (local or Supabase), searchable by time, subject and relevance"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.0",
  "psycopg[binary,pool]>=3.2",
  "fastembed>=0.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
memory-engine = "memory_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_engine = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
