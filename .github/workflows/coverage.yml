name: Test Coverage

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # GitHub's release downloads sometimes answer 504 for a while; try a few times before failing.
        run: |
          for attempt in 1 2 3 4 5; do
            pnpm --filter @aiembodied/main exec install-electron && exit 0
            echo "Electron download failed (attempt $attempt); retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Run tests with coverage
        run: xvfb-run --auto-servernum pnpm test:coverage
        # Note: xvfb-run is needed because tests run in Electron which requires a display
        # Porcupine tests are excluded due to heap exhaustion from vi.resetModules()
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

