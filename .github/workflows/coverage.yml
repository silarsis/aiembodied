name: Test Coverage

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        run: pnpm --filter @aiembodied/main exec install-electron
      - name: Run tests with coverage
        run: xvfb-run --auto-servernum pnpm test:coverage
        # Note: xvfb-run is needed because tests run in Electron which requires a display
        # Porcupine tests are excluded due to heap exhaustion from vi.resetModules()
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: ./coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

