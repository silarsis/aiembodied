name: Auto-merge

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run for PRs from silarsis. GitHub refuses auto-merge on drafts, and events without a
    # pull request (e.g. check_suite on main) have no PR number, so skip both.
    if: >-
      github.event.pull_request &&
      !github.event.pull_request.draft &&
      (github.event.pull_request.user.login == 'silarsis' || github.event.sender.login == 'silarsis')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
