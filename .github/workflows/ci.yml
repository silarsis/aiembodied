name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        run: pnpm --filter @aiembodied/main exec install-electron
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: xvfb-run --auto-servernum pnpm test
        # Note: xvfb-run is needed because tests run in Electron which requires a display
        # Porcupine tests are excluded due to heap exhaustion from vi.resetModules()

