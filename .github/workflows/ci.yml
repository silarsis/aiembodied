name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # GitHub's release downloads sometimes answer 504 for a while; try a few times before failing.
        run: |
          for attempt in 1 2 3 4 5; do
            pnpm --filter @aiembodied/main exec install-electron && exit 0
            echo "Electron download failed (attempt $attempt); retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: xvfb-run --auto-servernum pnpm test
        # Note: xvfb-run is needed because tests run in Electron which requires a display
        # Porcupine tests are excluded due to heap exhaustion from vi.resetModules()


  coding-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/coder
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com

  switchboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/switchboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  memory-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/memory
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
        env:
          MEMORY_TEST_DATABASE_URL: postgresql://memory:memory@localhost:5432/memory
