# Lint and format settings for the Python services (services/*). CI runs `ruff check` and `ruff format --check`.
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
  "E501",  # the formatter owns line length; long strings and URLs it can't wrap are fine
  "UP031", # printf-style formatting is fine where it is used
]

[lint.flake8-bugbear]
# FastAPI declares request parameters as default-argument calls.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Form", "fastapi.Path"]
